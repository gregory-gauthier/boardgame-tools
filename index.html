<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boardgame Tools</title>
<style>
  :root {
    --bg: #1b1f23;
    --panel: #23282d;
    --text: #e9e6df;
    --muted: #9aa1a8;
    --accent: #d4a24c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
  }
  main { width: 100%; max-width: 640px; }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 32px;
    font-size: 0.95rem;
  }
  .tools {
    display: grid;
    gap: 14px;
  }
  a.tool {
    display: block;
    background: var(--panel);
    border: 1px solid #33393f;
    border-radius: 10px;
    padding: 18px 20px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  a.tool:hover, a.tool:focus-visible {
    border-color: var(--accent);
    transform: translateX(2px);
  }
  a.tool .name {
    font-size: 1.05rem;
    font-weight: 600;
  }
  a.tool .desc {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 4px;
  }
</style>
</head>
<body>
<main>
  <h1>Boardgame Tools</h1>
  <p class="subtitle">Petits outils sans installation, pour les soirées jeux.</p>
  <div class="tools">
    <a class="tool" href="chrono-jeux.html">
      <div class="name">Chrono-Jeux</div>
      <div class="desc">Minuteur pour rythmer les tours de jeu.</div>
    </a>
    <a class="tool" href="patron-boites.html">
      <div class="name">Patron de boîtes</div>
      <div class="desc">Générateur de patrons de boîtes à imprimer.</div>
    </a>
  </div>
</main>
</body>
</html>
